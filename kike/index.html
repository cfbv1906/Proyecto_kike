<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyecto kike</title>
  <style>
    :root { --fondo: #0f1115; --texto: #f2f3f5; --acento: #7c6cff; --borde: #2a2d36; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 32px; padding: 32px 20px; background: var(--fondo); color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 44px); letter-spacing: .02em; }
    p.sub { margin: 8px 0 0; color: #a6aab5; font-size: 16px; }
    nav { display: flex; flex-direction: column; gap: 16px; width: min(100%, 420px); }
    a.boton {
      display: block; padding: 20px 24px; border-radius: 14px; text-decoration: none;
      border: 1px solid var(--borde); background: #171a21; color: var(--texto);
      font-size: 18px; font-weight: 600; transition: transform .15s, border-color .15s, background .15s;
    }
    a.boton small { display: block; margin-top: 6px; font-weight: 400; font-size: 14px; color: #a6aab5; }
    a.boton:hover, a.boton:focus-visible { border-color: var(--acento); background: #1c1f28; transform: translateY(-2px); outline: none; }
    a.boton.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
    a.boton.principal small { color: #e7e4ff; }
    a.boton.principal:hover { background: #8e80ff; }
    footer { color: #6f7480; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>NOMBRE DEL PRODUCTO</h1>
    <p class="sub">Elige cómo quieres vivir la experiencia</p>
  </header>

  <nav>
    <a class="boton principal" href="./ar/">
      Realidad aumentada
      <small>Apunta la cámara a la tarjeta</small>
    </a>
    <a class="boton" href="./filtro/">
      Filtro facial
      <small>Usa la cámara frontal</small>
    </a>
  </nav>

  <footer>Permite el acceso a la cámara cuando el navegador lo pida.</footer>
</body>
</html>
